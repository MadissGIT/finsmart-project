services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finsmart
      POSTGRES_DB: finsmart
      POSTGRES_PASSWORD: ${FINSMART_POSTGRES_PASSWORD:?Set FINSMART_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsmart -d finsmart"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      FINSMART_DATABASE_URL: ${FINSMART_DATABASE_URL:?Set FINSMART_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      FINSMART_DATABASE_URL: ${FINSMART_DATABASE_URL:?Set FINSMART_DATABASE_URL}
      FINSMART_JWT_SECRET: ${FINSMART_JWT_SECRET:?Set FINSMART_JWT_SECRET}
      FINSMART_CORS_ORIGINS: ${FINSMART_CORS_ORIGINS:?Set FINSMART_CORS_ORIGINS}
      FINSMART_FINANCIAL_TIMEZONE: ${FINSMART_FINANCIAL_TIMEZONE:-Europe/Moscow}
    ports:
      - "127.0.0.1:${FINSMART_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20

volumes:
  postgres_data:
