name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finsmart
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: finsmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsmart -d finsmart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINSMART_TEST_DATABASE_URL: postgresql+asyncpg://finsmart:test-only-password@localhost:5432/finsmart_test
      FINSMART_DATABASE_URL: postgresql+asyncpg://finsmart:test-only-password@localhost:5432/finsmart_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run ty check src scripts
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      - run: docker compose config --quiet
      - run: just up
      - name: Check API and seeded categories
        run: |
          curl --fail http://127.0.0.1:8000/api/v1/health/ready
          curl --fail http://127.0.0.1:8000/api/v1/categories > /tmp/categories.json
          python3 -c 'import json; assert len(json.load(open("/tmp/categories.json"))) == 11'
          curl --fail --request OPTIONS http://127.0.0.1:8000/api/v1/categories \
            --header 'Origin: http://localhost:5173' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type'
      - run: just check
      - run: docker compose run --rm test python -m scripts.smoke_week2
      - run: just migration-check
      - name: Verify restart with existing data
        run: docker compose restart api && docker compose up --wait --wait-timeout 60
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: just down

  production-compose:
    runs-on: ubuntu-latest
    env:
      FINSMART_POSTGRES_PASSWORD: ci-only-prod-compose-password
      FINSMART_DATABASE_URL: postgresql+asyncpg://finsmart:ci-only-prod-compose-password@db:5432/finsmart
      FINSMART_JWT_SECRET: ci-only-key-not-used-in-any-deployment-0123456789
      FINSMART_CORS_ORIGINS: '["https://finsmart.example"]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose -f compose.production.yaml up --build --wait --wait-timeout 180
      - name: Exercise release API
        working-directory: backend
        env:
          FINSMART_SMOKE_API: http://127.0.0.1:8000/api/v1/
        run: |
          uv sync --locked
          uv run python -m scripts.smoke_week2
      - name: Verify persistent JWT across restart
        run: |
          token=$(curl -fsS http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"restart@example.com","password":"CI-only-restart-password","full_name":"CI restart"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          test -n "$token"
          docker compose -f compose.production.yaml restart api
          curl -fsS --retry 15 --retry-connrefused --retry-delay 2 \
            -H "Authorization: Bearer $token" http://127.0.0.1:8000/api/v1/users/me >/dev/null
      - if: failure()
        run: docker compose -f compose.production.yaml ps --all
      - if: always()
        run: docker compose -f compose.production.yaml down
