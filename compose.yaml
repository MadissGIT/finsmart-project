services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finsmart
      POSTGRES_PASSWORD: finsmart_local
      POSTGRES_DB: finsmart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsmart -d finsmart"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: runtime
    environment:
      FINSMART_DATABASE_URL: postgresql+asyncpg://finsmart:finsmart_local@db:5432/finsmart
      FINSMART_CORS_ORIGINS: '${FINSMART_CORS_ORIGINS:-[]}'
    ports:
      - "127.0.0.1:${FINSMART_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn src.app:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"
      interval: 3s
      timeout: 6s
      start_period: 10s
      retries: 20

  test:
    profiles: [test]
    build:
      context: .
      target: development
    environment:
      FINSMART_TEST_DATABASE_URL: postgresql+asyncpg://finsmart:finsmart_local@db:5432/finsmart
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
