[project]
name = "finsmart-backend"
version = "0.1.0"
description = "ФинСмарт backend foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.115,<0.136",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.46,<2.1",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28,<0.29",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "ASYNC", "A", "C4", "DTZ", "T20", "SIM", "RET", "PTH",
    "RUF005", "RUF006", "RUF012", "RUF013", "RUF015", "RUF019", "RUF100",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
