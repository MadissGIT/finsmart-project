[project]
name = "finsmart-backend"
version = "0.2.0"
description = "ФинСмарт: импорт выписок и бюджетная аналитика"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18,<2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31,<1",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.115,<0.136",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.12,<3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.46,<2.1",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28,<0.29",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "ty>=0.0.90",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "ASYNC", "A", "C4", "DTZ", "T20", "SIM", "RET", "PTH",
    "RUF005", "RUF006", "RUF012", "RUF013", "RUF015", "RUF019", "RUF100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
